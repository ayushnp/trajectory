[project]
name = "trajectory"
version = "0.1.0"
description = "Pass-through tracing proxy between coding agents and Tux"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "httptools>=0.6",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "pydantic>=2.6",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "pytest-asyncio>=0.23"]
green = ["ecologits"]

[project.scripts]
trajectory = "trajectory.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
